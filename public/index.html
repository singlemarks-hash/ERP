<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>작은따옴표 ERP</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- ?v= 는 캐시 무효화용. css/js를 고칠 때마다 아래 3곳의 값을 같이 올려야
       모바일 브라우저가 예전 파일을 계속 쓰지 않는다. -->
  <link rel="stylesheet" href="css/styles.css?v=20260901a" />
</head>
<body>
  <!-- 로그인 화면 -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="brand">
        <h1>작은따옴표 <em>ERP</em></h1>
        <p class="brand-sub">부서와 이름을 선택하고 비밀번호를 입력하세요</p>
      </div>

      <form id="login-form" autocomplete="off">
        <label class="field">
          <span class="field-label">부서</span>
          <select id="login-dept" required>
            <option value="" disabled selected>부서 선택</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">이름</span>
          <select id="login-name" required disabled>
            <option value="" disabled selected>부서를 먼저 선택하세요</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">비밀번호</span>
          <input type="password" id="login-password" placeholder="비밀번호 입력" required />
        </label>
        <p id="login-error" class="form-error hidden"></p>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>

      <div id="bootstrap-box" class="bootstrap-box hidden">
        <hr class="rule" />
        <p class="bootstrap-note">등록된 직원이 없습니다. 시스템을 처음 시작하려면<br />경영지원본부 관리자를 먼저 등록하세요.</p>
        <button id="bootstrap-open" class="btn btn-ghost btn-block">시스템 초기 설정</button>
      </div>
    </div>
  </div>

  <!-- 앱 셸 -->
  <div id="app-shell" class="app-shell hidden">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebar-close" aria-label="메뉴 닫기">✕</button>
      <div class="brand-block">
        <div class="b-name">작은따옴표 ERP</div>
        <span class="b-sub">사내 업무 포털</span>
      </div>
      <div class="profile" id="user-card"><!-- 좌측 상단 사용자 기본정보 --></div>
      <nav class="nav" id="nav"><!-- 메뉴 --></nav>
      <button id="logout-btn" class="btn btn-ghost logout-btn">로그아웃</button>
    </aside>
    <header class="m-header">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="메뉴 열기">☰</button>
      <div class="m-title"><b>작은따옴표 ERP</b><span>사내 업무 포털</span></div>
    </header>
    <main class="main" id="main"><!-- 뷰 렌더링 --></main>
  </div>

  <!-- 공용 모달 -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=20260901a"></script>
  <script src="js/app.js?v=20260901a"></script>
</body>
</html>
